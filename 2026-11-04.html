function hx(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function toHex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return('0'+x.toString(16)).slice(-2);}).join('');}
async function derive(pw){var m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return toHex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:hx(D.salt),iterations:D.iter,hash:'SHA-256'},m,256));}
async function open(keyHex){var k=await crypto.subtle.importKey('raw',hx(keyHex),'AES-CBC',false,['decrypt']);
  var pt=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:hx(D.iv)},k,b64(D.ct)));
  if(!/^\s*<(!doctype|html)/i.test(pt)) throw new Error('bad');
  document.open();document.write(pt);document.close();}
function store(){try{return localStorage;}catch(e){return null;}}
(async function(){
  var s=store(), saved=s&&s.getItem('cib-key');
  if(saved){try{await open(saved);return;}catch(e){s.removeItem('cib-key');}}
  document.getElementById('gate').hidden=false;
  document.getElementById('f').onsubmit=async function(ev){ev.preventDefault();
    var er=document.getElementById('er'); er.textContent='Unlocking…';
    var remember=document.getElementById('rm').checked;   // read before the page is replaced
    try{var k=await derive(document.getElementById('pw').value); await open(k);
      if(s){ if(remember) s.setItem('cib-key',k); else s.removeItem('cib-key'); }
    }catch(e){er.textContent='Wrong password — try again.';}};
})();
